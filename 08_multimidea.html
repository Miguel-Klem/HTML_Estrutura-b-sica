<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabelas Avançadas e Multimédia</title>
    <link rel="stylesheet" href="/Estilizando_com_CSS/08_tab_multimidea.css">
</head>
<body>
    <h1>Relatório de Vendas</h1>

    <!-- TABELA SIMPLIFICADA E MAIS COMPACTA -->
    <table class="tabela-relatorio">
        <caption>Vendas por Região - 2026</caption>
        <thead>
            <tr>

                <!-- Cabeçalho para a coluna Região -->
                <th>Região</th>

                <!-- Cabeçalho para os trimestres -->
                <th class="num-right">1º Trim</th>
                <th class="num-right">2º Trim</th>
                <th class="num-right">3º Trim</th>
                
                <!-- Cabeçalho para o total geral -->
                <th class="num-right">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>

                <!-- Linha de dados para a região Norte -->
                <td>Norte</td>
                <td class="num-right">R$ 10.000</td>
                <td class="num-right">R$ 12.000</td>
                <td class="num-right">R$ 15.000</td>
                <td class="num-right total linha"><strong>R$ 37.000</strong></td>
            </tr>
        </tbody>
        <tfoot>

            <!-- Rodapé com total geral -->
            <tr>
                <td>Total Geral</td>
                <td class="num-right">R$ 10.000</td>
                <td class="num-right">R$ 12.000</td>
                <td class="num-right">R$ 15.000</td>
                <td class="num-right">R$ 37.000</td>
            </tr>
        </tfoot>
    </table>

    <hr>

    <!-- MULTIMÉDIA EM HTML5 -->

    <h2>Inserindo vídeos locais</h2>

    <!-- Vídeo usando um arquivo local, com largura fixa e imagem inicial (poster) -->
    <video class="video-local" width="500" poster="assets/lanave-capa.png" controls>
        <source src="assets/meu-video.mp4" type="video/mp4">

        <!-- Mensagem que aparece se o navegador não suportar a tag vídeo -->
        Seu navegador não suporta vídeo HTML5.
    </video>
    <hr>

    <h2>Inserindo vídeos do Youtube</h2>

    <!-- Vídeo incorporado via iframe com configurações para controle de permissões -->
    <iframe class="video-youtube" width="560" height="315"
        src="https://www.youtube.com/embed/reqm?start="
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write;
        gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <hr>

    <h2>Vamos aprender a reproduzir áudios em HTML5.</h2>
    <!-- Reprodução de áudio com autoplay e controlos visíveis -->
    <audio class="player-audio" preload="metadata" autoplay controls>
        <source src="assets/happy-mistake.mp3" type="audio/mpeg">

        <!-- Mensagem alternativa caso áudio não seja suportado -->
        Seu navegador não suporta áudio HTML5.
    </audio>

</body>
</html>
